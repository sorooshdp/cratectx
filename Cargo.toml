[package]
name = "cratectx"
version = "1.3.1"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
arboard = "3.4"
anyhow = "1.0"
syn = { version = "2.0", features = ["full", "parsing", "visit"] }
quote = "1.0"
petgraph = "0.6"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
